name: Screenshots

# Every screen on an iPhone SE, an iPhone 16 and a Pixel 7 (iPhones at full Home Screen size), with demo data, for design review.
# Download them from the run's Artifacts section.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    # Pinned, not ubuntu-latest: that moved to Ubuntu 26.04, which Playwright 1.52 couldn't install browsers on. Check
    # that the Playwright in package.json supports a newer image before changing it back.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Playwright is a devDependency, so `npm ci` installed the version in package-lock.json. Its browsers are cached
      # per lockfile, so a Playwright upgrade fetches new ones.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium webkit

      - run: node scripts/screenshots.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
